[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-nft-collection-generator"
version = "0.6.3"
description = "Modular toolkit for generating AI-driven NFT collections: trait synthesis, diffusion rendering, rarity scoring, metadata, and IPFS pinning."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-nft-collection-generator contributors" }]
keywords = ["nft", "generative-art", "diffusion", "ipfs", "erc721", "collection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "pillow>=10.2",
  "numpy>=1.26",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
  "tenacity>=8.2",
]

[project.optional-dependencies]
render = ["torch>=2.2", "diffusers>=0.27", "accelerate>=0.29"]
pin = ["pinatapy-vourhey>=0.2"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.9",
  "ruff>=0.4",
  "pre-commit>=3.7",
]

[project.scripts]
ai-nft-gen = "ai_nft_gen.cli:app"

[tool.setuptools.packages.find]
include = ["ai_nft_gen*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]